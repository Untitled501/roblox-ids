<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Archivo:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16131C;
  --panel:#211C2B;
  --panel-2:#2A2336;
  --edge:#3A3149;
  --amber:#F2A93B;
  --mint:#6FD3B2;
  --rose:#E0607E;
  --fog:#9A90AC;
  --bone:#F0EAF5;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:'Archivo',system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 96px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:clamp(34px,7vw,54px);
  line-height:.95;
  letter-spacing:-.03em;
  margin:0;
}
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--fog);
  margin:0 0 8px;
}
.status{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;
  color:var(--fog);
  background:var(--panel);border:1px solid var(--edge);
  border-radius:999px;padding:6px 13px;
  cursor:pointer;
}
.status:hover{border-color:var(--fog)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fog);flex:none}
.status[data-s="ready"] .dot{background:var(--mint)}
.status[data-s="saving"] .dot,.status[data-s="syncing"] .dot{background:var(--amber)}
.status[data-s="error"] .dot{background:var(--rose)}

/* ---------- controls ---------- */
.search{position:relative;margin-bottom:14px}
.search input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--edge);
  border-radius:var(--r);
  color:var(--bone);
  font-family:'Archivo',sans-serif;font-size:16px;
  padding:14px 16px;
}
.search input::placeholder{color:var(--fog)}
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.chip{
  flex:none;
  background:var(--panel);border:1px solid var(--edge);color:var(--fog);
  border-radius:999px;padding:8px 15px;cursor:pointer;
  font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;
  white-space:nowrap;
}
.chip:hover{color:var(--bone);border-color:var(--fog)}
.chip[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.chip .n{font-family:'DM Mono',monospace;font-size:12px;opacity:.65;margin-left:7px}

/* ---------- pads ---------- */
ul.pads{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pad{
  position:relative;
  background:var(--panel);
  border:1px solid var(--edge);
  border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  padding:15px 50px 15px 18px;
  transition:background .12s,border-color .12s;
}
.pad:hover{background:var(--panel-2);border-color:var(--fog)}
.pad-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pad-id{
  font-family:'DM Mono',monospace;font-weight:500;
  font-size:clamp(20px,4.6vw,26px);
  letter-spacing:.01em;
  color:var(--amber);
  cursor:pointer;
}
.copy{
  flex:none;
  font-family:'DM Mono',monospace;font-size:11px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:1px solid var(--edge);color:var(--fog);
  border-radius:999px;padding:6px 14px;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.copy:hover{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.copy:active{transform:scale(.95)}
.pad-meta{display:flex;align-items:center;gap:9px;margin-top:5px;flex-wrap:wrap}
.pad-name{font-size:14px;color:var(--bone)}
.pad-cat{
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mint);border:1px solid rgba(111,211,178,.3);border-radius:999px;padding:2px 9px;
}
/* sampler pad trigger */
.pad.lit{background:var(--amber);border-color:var(--amber)}
.pad.lit .pad-id{color:var(--ink)}
.pad.lit .pad-name{color:rgba(22,19,28,.75)}
.pad.lit .pad-cat{color:rgba(22,19,28,.8);border-color:rgba(22,19,28,.3)}
.pad.lit .copy{background:var(--ink);border-color:var(--ink);color:var(--amber)}
.pad.lit .del{color:rgba(22,19,28,.5)}
.del{
  position:absolute;right:12px;top:13px;
  width:30px;height:30px;border-radius:9px;
  background:transparent;border:1px solid transparent;color:var(--fog);
  font-size:18px;line-height:1;cursor:pointer;
}
.del:hover{color:var(--rose);border-color:rgba(224,96,126,.4)}

/* ---------- empty ---------- */
.empty{
  border:1px dashed var(--edge);border-radius:var(--r);
  padding:36px 22px;text-align:center;color:var(--fog);
}
.empty strong{display:block;color:var(--bone);font-size:17px;margin-bottom:5px;font-weight:600}

/* ---------- add form ---------- */
.add{
  margin-top:26px;
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
  padding:18px;
}
.add h2{
  font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fog);margin:0 0 14px;font-weight:400;
}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:10px}
.field label{
  display:block;font-size:12px;color:var(--fog);margin-bottom:5px;
}
.field input{
  width:100%;background:var(--ink);border:1px solid var(--edge);border-radius:10px;
  color:var(--bone);font-family:'Archivo',sans-serif;font-size:15px;padding:11px 13px;
}
.field input#f-id{font-family:'DM Mono',monospace}
.field input::placeholder{color:#5C5470}
button.go{
  width:100%;margin-top:4px;
  background:var(--amber);color:var(--ink);border:none;border-radius:10px;
  font-family:'Archivo',sans-serif;font-size:15px;font-weight:600;
  padding:13px;cursor:pointer;
}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.45;cursor:default}

/* ---------- settings ---------- */
dialog{
  background:var(--panel);color:var(--bone);
  border:1px solid var(--edge);border-radius:var(--r);
  padding:22px;max-width:440px;width:calc(100% - 32px);
}
dialog::backdrop{background:rgba(10,8,14,.72)}
dialog h2{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
dialog p.hint{font-size:13px;color:var(--fog);margin:0 0 18px;line-height:1.5}
dialog .field{margin-bottom:11px}
.actions{display:flex;gap:9px;margin-top:16px}
.actions button{
  flex:1;padding:11px;border-radius:10px;font-family:'Archivo',sans-serif;font-size:14px;
  font-weight:600;cursor:pointer;border:1px solid var(--edge);
}
.btn-primary{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.btn-ghost{background:transparent;color:var(--fog)}
.btn-ghost:hover{color:var(--bone)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--panel-2);border:1px solid var(--edge);border-radius:11px;
  padding:12px 18px;font-size:14px;max-width:90vw;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--rose);color:#FFD9E1}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (max-width:560px){
  .row{grid-template-columns:1fr}
  .pad{padding-right:46px}
  .pad-top{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="eyebrow" id="count">loading</p>
      <h1>sound library</h1>
    </div>
    <button class="status" id="status" data-s="readonly">
      <span class="dot"></span><span id="status-text">read only</span>
    </button>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="Search names, IDs, categories" autocomplete="off">
  </div>

  <nav class="rail" id="rail"></nav>

  <ul class="pads" id="pads"></ul>

  <section class="add">
    <h2>Add a sound</h2>
    <div class="field" style="margin-bottom:10px">
      <label for="f-id">Audio ID</label>
      <input id="f-id" placeholder="1837879082" inputmode="numeric" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <label for="f-name">Name <span style="opacity:.6">(optional)</span></label>
        <input id="f-name" placeholder="What is it?" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-cat">Category <span style="opacity:.6">(optional)</span></label>
        <input id="f-cat" placeholder="Memes" list="cats" autocomplete="off">
        <datalist id="cats"></datalist>
      </div>
    </div>
    <button class="go" id="go">Add to library</button>
  </section>
</div>

<dialog id="cfg">
  <h2>Settings</h2>
  <p class="hint">Your token is stored in this browser only and is never sent anywhere except GitHub. Use a fine-grained token limited to this one repository.</p>
  <div class="field"><label for="c-owner">GitHub username</label><input id="c-owner" autocomplete="off"></div>
  <div class="field"><label for="c-repo">Repository name</label><input id="c-repo" autocomplete="off"></div>
  <div class="field"><label for="c-path">File path</label><input id="c-path" autocomplete="off"></div>
  <div class="field"><label for="c-token">Access token</label><input id="c-token" type="password" autocomplete="off" placeholder="github_pat_..."></div>
  <div class="actions">
    <button class="btn-ghost" id="c-clear">Remove token</button>
    <button class="btn-primary" id="c-save">Save settings</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
/* ============ storage (falls back to memory if blocked) ============ */
const store=(()=>{let mem={},ok=true;
  try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){ok=false}
  return{
    get:k=>{try{return ok?localStorage.getItem(k):(k in mem?mem[k]:null)}catch(e){return k in mem?mem[k]:null}},
    set:(k,v)=>{try{ok?localStorage.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}},
  };
})();

/* ============ state ============ */
const CFG='soundlib.cfg.v1';
let cfg={owner:'',repo:'',path:'songs.json',token:''};
let songs=[],sha=null,filter='all',query='';

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toB64(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function fromB64(b64){const bin=atob(String(b64).replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}

function detectRepo(){
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m)return null;
  const seg=location.pathname.split('/').filter(Boolean);
  return {owner:m[1],repo:seg.length?seg[0]:location.hostname};
}

function loadCfg(){
  try{Object.assign(cfg,JSON.parse(store.get(CFG)||'{}'))}catch(e){}
  if(!cfg.owner||!cfg.repo){const d=detectRepo();if(d){cfg.owner=cfg.owner||d.owner;cfg.repo=cfg.repo||d.repo}}
  if(!cfg.path)cfg.path='songs.json';
}
function saveCfg(){store.set(CFG,JSON.stringify(cfg))}

const apiUrl=()=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
const authHeaders=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});

async function errText(r){
  try{const j=await r.json();return j.message||r.status}catch(e){return 'HTTP '+r.status}
}

let toastTimer;
function toast(msg,bad){
  const t=$('#toast');t.textContent=msg;t.className='on'+(bad?' bad':'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',2600);
}

const LABELS={readonly:'read only',syncing:'loading',ready:'connected',saving:'saving',error:'save failed'};
function setStatus(s){$('#status').dataset.s=s;$('#status-text').textContent=LABELS[s]||s}

/* ============ github i/o ============ */
function parseFile(text){
  const j=JSON.parse(text);
  const arr=Array.isArray(j)?j:(j.songs||[]);
  return arr.filter(x=>x&&x.id).map(x=>({
    id:String(x.id),name:x.name||'',category:x.category||'',added:x.added||''
  }));
}

async function load(){
  const live=cfg.token&&cfg.owner&&cfg.repo;
  setStatus(live?'syncing':'readonly');
  try{
    if(live){
      const r=await fetch(apiUrl(),{headers:authHeaders(),cache:'no-store'});
      if(r.status===404){songs=[];sha=null;setStatus('ready');render();return}
      if(!r.ok)throw new Error(await errText(r));
      const j=await r.json();sha=j.sha;songs=parseFile(fromB64(j.content));
      setStatus('ready');
    }else{
      const r=await fetch(cfg.path+'?cb='+Date.now(),{cache:'no-store'});
      songs=r.ok?parseFile(await r.text()):[];
      setStatus('readonly');
    }
  }catch(e){
    setStatus('error');
    toast('Could not load your library: '+e.message,true);
  }
  render();
}

async function push(message){
  if(!cfg.token){toast('Add a token in Settings to save changes.',true);return false}
  setStatus('saving');
  const payload={message,content:toB64(JSON.stringify({songs},null,2)+'\n')};
  const send=()=>fetch(apiUrl(),{method:'PUT',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify(sha?{...payload,sha}:payload)});
  let r=await send();
  if(r.status===409||r.status===422){          // someone else changed the file
    const g=await fetch(apiUrl(),{headers:authHeaders(),cache:'no-store'});
    if(g.ok){const j=await g.json();sha=j.sha;r=await send()}
  }
  if(!r.ok){setStatus('error');toast('Could not save: '+await errText(r),true);return false}
  const j=await r.json();sha=j.content.sha;setStatus('ready');
  return true;
}

/* ============ render ============ */
function categories(){
  const m=new Map();
  songs.forEach(s=>{const c=s.category||'Uncategorized';m.set(c,(m.get(c)||0)+1)});
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}

function visible(){
  const q=query.trim().toLowerCase();
  return songs.filter(s=>{
    const c=s.category||'Uncategorized';
    if(filter!=='all'&&c!==filter)return false;
    if(!q)return true;
    return (s.name+' '+s.id+' '+c).toLowerCase().includes(q);
  });
}

function render(){
  const cats=categories();
  $('#count').textContent=songs.length===1?'1 id saved':songs.length+' ids saved';

  $('#rail').innerHTML=[['all','All',songs.length],...cats.map(([c,n])=>[c,c,n])]
    .map(([k,label,n])=>`<button class="chip" data-cat="${esc(k)}" aria-pressed="${filter===k}">${esc(label)}<span class="n">${n}</span></button>`).join('');

  $('#cats').innerHTML=cats.map(([c])=>`<option value="${esc(c)}">`).join('');

  const list=visible();
  const pads=$('#pads');
  if(!list.length){
    pads.innerHTML=`<li class="empty">${songs.length
      ? '<strong>Nothing matches that</strong>Try a different search or category.'
      : '<strong>No sounds yet</strong>Paste an audio ID below to start your library.'}</li>`;
    return;
  }
  pads.innerHTML=list.map(s=>`
    <li class="pad" data-id="${esc(s.id)}">
      <div class="pad-top">
        <span class="pad-id">${esc(s.id)}</span>
        <button class="copy" aria-label="Copy ID ${esc(s.id)}">copy</button>
      </div>
      <div class="pad-meta">
        ${s.name?`<span class="pad-name">${esc(s.name)}</span>`:''}
        <span class="pad-cat">${esc(s.category||'Uncategorized')}</span>
      </div>
      <button class="del" aria-label="Delete ${esc(s.name||s.id)}">&times;</button>
    </li>`).join('');
}

/* ============ actions ============ */
async function copyId(id,pad){
  try{
    if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(id);
    else{const t=document.createElement('textarea');t.value=id;t.style.position='fixed';t.style.opacity=0;
      document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    const btn=pad.querySelector('.copy');
    pad.classList.add('lit');btn.textContent='copied';
    clearTimeout(pad._t);
    pad._t=setTimeout(()=>{pad.classList.remove('lit');btn.textContent='copy'},700);
  }catch(e){toast('Copy blocked by the browser. Select the number manually.',true)}
}

function cleanId(raw){
  const m=String(raw).match(/\d{4,}/g);
  return m?m.sort((a,b)=>b.length-a.length)[0]:'';
}

async function addSong(){
  const id=cleanId($('#f-id').value);
  if(!id){toast('Enter an audio ID — digits, a rbxassetid link, or a library URL.',true);$('#f-id').focus();return}
  if(songs.some(s=>s.id===id)){toast('That ID is already in your library.',true);return}
  const song={
    id,
    name:$('#f-name').value.trim(),
    category:$('#f-cat').value.trim(),
    added:new Date().toISOString().slice(0,10)
  };
  const snapshot=songs.slice();
  songs=[song,...songs];
  render();
  $('#go').disabled=true;
  const ok=await push('Add '+(song.name||id));
  $('#go').disabled=false;
  if(ok){
    $('#f-id').value='';$('#f-name').value='';
    $('#f-id').focus();
    toast('Added '+(song.name||id));
  }else{
    songs=snapshot;render();
  }
}

async function delSong(id){
  const s=songs.find(x=>x.id===id);if(!s)return;
  if(!confirm('Remove '+(s.name||id)+' from the library?'))return;
  const snapshot=songs.slice();
  songs=songs.filter(x=>x.id!==id);
  render();
  if(!await push('Remove '+(s.name||id))){songs=snapshot;render()}
}

/* ============ wiring ============ */
$('#pads').addEventListener('click',e=>{
  const pad=e.target.closest('.pad');if(!pad)return;
  if(e.target.closest('.del'))return delSong(pad.dataset.id);
  if(e.target.closest('.copy')||e.target.closest('.pad-id'))return copyId(pad.dataset.id,pad);
});
$('#rail').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  filter=c.dataset.cat;render();
});
$('#q').addEventListener('input',e=>{query=e.target.value;render()});
$('#go').addEventListener('click',addSong);
['f-id','f-name','f-cat'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')addSong()}));

$('#status').addEventListener('click',()=>{
  $('#c-owner').value=cfg.owner;$('#c-repo').value=cfg.repo;
  $('#c-path').value=cfg.path;$('#c-token').value=cfg.token;
  $('#cfg').showModal();
});
$('#c-save').addEventListener('click',()=>{
  cfg.owner=$('#c-owner').value.trim();
  cfg.repo=$('#c-repo').value.trim();
  cfg.path=$('#c-path').value.trim()||'songs.json';
  cfg.token=$('#c-token').value.trim();
  saveCfg();$('#cfg').close();load();
});
$('#c-clear').addEventListener('click',()=>{
  cfg.token='';saveCfg();$('#cfg').close();load();
  toast('Token removed from this browser.');
});

loadCfg();load();
</script>
</body>
</html>
